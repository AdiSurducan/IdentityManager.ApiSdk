<configuration>
	<category name="settings">
		<!-- Connection string of the database -->
		<value name="connectionstring">Data Source=#Server#;Initial Catalog=#DB#;User ID=#User#;Password=#Password#</value>
		
		<!-- SELECT statement to execute -->
		<value name="query">
			select top 1 pib.xuserinserted
			from person p
			join personinbasetree pib on p.uid_person = pib.uid_person
			where p.lastname like char(convert(int, rand() * 26.0) + ascii('A')) + '%'
		</value>
		
		<!-- Performance counter category -->
		<value name="category">DB Performance</value>
		
		<!-- Performance counter name -->
		<value name="caption">Query Duration</value>
		
		<!-- Interval of query execution -->
		<value name="interval">00:01:00</value>		
	</category>
</configuration>